[project]
name = "finalproject-gabdulkhakov-m26-555"
version = "0.1.0"
description = "ValutaTrade Hub - CLI wallet for fiat and crypto currencies"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Gabdulkhakov" }]
dependencies = [
    "prettytable>=3.10",
    "requests>=2.31",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[project.scripts]
project = "valutatrade_hub.cli.interface:main"
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# Конфигурация приложения (читается infra/settings.py → SettingsLoader).
# Относительные пути считаются от каталога этого файла.
[tool.valutatrade]
data_dir = "data"
users_file = "data/users.json"
portfolios_file = "data/portfolios.json"
rates_file = "data/rates.json"
exchange_rates_file = "data/exchange_rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_dir = "logs"
actions_log_file = "logs/actions.log"
log_level = "INFO"
log_format = "%(levelname)s %(asctime)s %(message)s"
log_date_format = "%Y-%m-%dT%H:%M:%S"
log_max_bytes = 1048576
log_backup_count = 5
