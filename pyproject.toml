[project]
name = "finalproject-gabdulkhakov-m26-555"
version = "0.1.0"
description = "ValutaTrade Hub - CLI wallet for fiat and crypto currencies"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Gabdulkhakov" }]
dependencies = [
    "prettytable>=3.10",
    "requests>=2.31",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]